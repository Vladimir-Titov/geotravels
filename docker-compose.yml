services:
  users_postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - '54441:5432'
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U postgres -d postgres'" ]
      interval: 1s
      timeout: 3s
      retries: 30
  s3_minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GEOTRAVELS_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${GEOTRAVELS_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - geotravels_minio_data:/data
  s3_minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [s3_minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3_minio:9000 ${GEOTRAVELS_S3_ACCESS_KEY_ID:-minioadmin} ${GEOTRAVELS_S3_SECRET_ACCESS_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${GEOTRAVELS_S3_BUCKET_NAME:-user-bucket};
      "
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.3
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://s3_minio:9000
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: ${GEOTRAVELS_S3_REGION_NAME:-us-east-1}
      IMGPROXY_ALLOWED_SOURCES: s3://${GEOTRAVELS_S3_BUCKET_NAME:-user-bucket}/
      IMGPROXY_KEY: ${GEOTRAVELS_IMGPROXY_KEY:-736563726574}
      IMGPROXY_SALT: ${GEOTRAVELS_IMGPROXY_SALT:-68656c6c6f}
      AWS_ACCESS_KEY_ID: ${GEOTRAVELS_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${GEOTRAVELS_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '8080:8080'
    depends_on:
      - s3_minio
      - s3_minio_init

volumes:
  geotravels_postgres_data:
  geotravels_minio_data:
