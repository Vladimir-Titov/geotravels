services:
  users_postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - '54441:5432'
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U postgres -d postgres'" ]
      interval: 1s
      timeout: 3s
      retries: 30
  s3_minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GEOTRAVELS_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${GEOTRAVELS_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - geotravels_minio_data:/data
  s3_minio_init:
    image: minio/mc:latest
    depends_on: [s3_minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3_minio:9000 ${GEOTRAVELS_S3_ACCESS_KEY_ID:-minioadmin} ${GEOTRAVELS_S3_SECRET_ACCESS_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${GEOTRAVELS_S3_BUCKET_NAME:-tripmark-files};
      "

volumes:
  geotravels_postgres_data:
  geotravels_minio_data:
